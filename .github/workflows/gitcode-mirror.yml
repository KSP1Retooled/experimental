name: Mirror to GitCode

# Mirrors the branches and tags to GitCode, then (re)makes every release
# there whose files differ from the GitHub release by name or sha256.
# Releases whose files are identical are skipped, so running this again when
# nothing changed uploads nothing.
#
# GitHub has no event for "a file was uploaded to a release". The closest are
# these two: published fires when a release is first made public, edited when
# its title, notes or other details are changed. Uploading a file to an
# existing release fires neither, so whatever uploads the files has to start
# this workflow when it is done (gh workflow run gitcode-mirror.yml) or edit
# the release afterwards.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror even if its files are identical (optional)
        required: false

permissions:
  contents: read

env:
  GITCODE_OWNER: ksp1retooled
  GITCODE_REPO: experimental

jobs:
  # Quick: push branches and tags, and list the releases whose files differ.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One sync at a time; each one mirrors the whole current state.
    concurrency:
      group: gitcode-sync
      cancel-in-progress: false
    outputs:
      tags: ${{ steps.sync.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sync pushes every branch and tag.
          fetch-depth: 0

      - name: Sync repository and find releases to mirror
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          # The GITEEPAT secret holds the GitCode personal access token.
          GITCODE_TOKEN: ${{ secrets.GITEEPAT }}
          # Only a manual run can force a release; release events rely on
          # the file comparison like everything else.
          EXPLICIT_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/gitcode-sync.sh

  release:
    needs: sync
    if: needs.sync.outputs.tags != '' && needs.sync.outputs.tags != '[]'
    runs-on: ubuntu-latest
    # Assets upload in parallel straight to GitCode's object storage, so a
    # release takes about as long as its largest asset. Keep the GitHub-hosted
    # 6 h ceiling as headroom until real upload speeds are known.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.sync.outputs.tags) }}
    # A newer run for the same tag replaces an older one: the mirror starts
    # by deleting whatever GitCode has for the tag.
    concurrency:
      group: gitcode-release-${{ matrix.tag }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the mirror pushes the release's tag.
          fetch-depth: 0

      # Uploads cross a long, lossy link to China. BBR keeps throughput up
      # under packet loss where the default CUBIC collapses, and bigger send
      # buffers let each connection keep more data in flight. Best effort:
      # the mirror still runs if the runner refuses these settings.
      - name: Tune TCP for long-distance uploads
        continue-on-error: true
        run: |
          sudo modprobe tcp_bbr
          sudo sysctl -w net.core.default_qdisc=fq \
            net.ipv4.tcp_congestion_control=bbr \
            net.core.wmem_max=67108864 \
            net.ipv4.tcp_wmem="4096 65536 67108864" \
            net.ipv4.tcp_slow_start_after_idle=0
          sysctl net.ipv4.tcp_congestion_control

      # In this order:
      #   1. delete the GitCode release and its tag, if they exist
      #   2. push the tag to GitCode
      #   3. create the GitCode release and upload every asset
      - name: Mirror release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The GITEEPAT secret holds the GitCode personal access token.
          GITCODE_TOKEN: ${{ secrets.GITEEPAT }}
          TAG: ${{ matrix.tag }}
        run: bash .github/scripts/gitcode-mirror.sh
